<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סורק טיסות זולות</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#6b7686; --line:#e3e7ee; --accent:#0a6cff; --good:#0f8a4f; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b212a; --text:#e8edf4; --muted:#93a0b2; --line:#2a323e; --accent:#4d9bff; --good:#3ecf8e; --bad:#ff6b6b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; line-height:1.5; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  input, select, button { font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); width:100%; }
  button { cursor:pointer; background:var(--accent); color:#fff; border:none; font-weight:600; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--line); width:auto; padding:6px 12px; font-weight:400; }
  button.danger { color:var(--bad); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .watch { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .price { font-size:1.3rem; font-weight:700; }
  .good { color:var(--good); } .muted { color:var(--muted); font-size:.9rem; }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); font-size:.78rem; margin-inline-end:4px; }
  #msg { color:var(--bad); min-height:1.4em; }
  .hidden { display:none; }
  .check { display:flex; align-items:center; gap:8px; } .check input { width:auto; }
</style>
</head>
<body>
<main>
  <h1>✈️ סורק טיסות זולות מנתב"ג</h1>
  <div id="msg"></div>

  <!-- התחברות -->
  <section id="auth" class="card hidden">
    <div class="grid">
      <div><label>אימייל</label><input id="email" type="email" autocomplete="username"></div>
      <div><label>סיסמה</label><input id="password" type="password" autocomplete="current-password"></div>
      <div style="align-self:end"><button id="loginBtn">התחברות</button></div>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <strong>מעקב חדש</strong>
      <form id="form" style="margin-top:12px">
        <div class="grid">
          <div><label>יעד</label>
            <select id="dest"></select></div>
          <div id="customWrap" class="hidden"><label>קוד IATA (3 אותיות)</label><input id="customCode" maxlength="3" placeholder="ATH"></div>
          <div><label>מחודש</label><input id="mFrom" type="month" required></div>
          <div><label>עד חודש</label><input id="mTo" type="month" required></div>
          <div><label>מינימום ימי חופשה</label><input id="minDays" type="number" min="1" max="60" value="4" required></div>
          <div><label>מקסימום ימי חופשה</label><input id="maxDays" type="number" min="1" max="60" value="7" required></div>
          <div><label>מחיר מקסימלי הלוך-חזור ($)</label><input id="maxPrice" type="number" min="1" required></div>
        </div>
        <div class="row" style="margin-top:12px; justify-content:space-between">
          <label class="check"><input id="direct" type="checkbox"> טיסה ישירה בלבד</label>
          <button type="submit" style="width:auto;padding:9px 24px">הוספה</button>
        </div>
      </form>
    </div>

    <div class="row" style="justify-content:space-between; margin-bottom:8px">
      <strong>המעקבים שלי</strong>
      <button id="logout" class="secondary">התנתקות</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
// ===== הגדרות: ממלאים אחרי יצירת פרויקט ב-Supabase (Project Settings -> API) =====
const SUPABASE_URL = "https://oitjbsjwfycydasdctdh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pdGpic2p3ZnljeWRhc2RjdGRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMzMzNDAsImV4cCI6MjEwNjcwOTM0MH0.-09ZaOZFNhCcbHKpxVVxkt2zEyxT8fnX44_Co8ZSwcg";   // מפתח anon (ציבורי) - לא service_role!

const DESTINATIONS = [
  ["ATH","אתונה"],["LCA","לרנקה"],["PFO","פאפוס"],["RHO","רודוס"],["HER","הרקליון (כרתים)"],["SKG","סלוניקי"],
  ["LON","לונדון"],["PAR","פריז"],["ROM","רומא"],["MIL","מילאנו"],["BCN","ברצלונה"],["MAD","מדריד"],
  ["LIS","ליסבון"],["AMS","אמסטרדם"],["BER","ברלין"],["VIE","וינה"],["PRG","פראג"],["BUD","בודפשט"],
  ["WAW","ורשה"],["KRK","קרקוב"],["BEG","בלגרד"],["TIA","טירנה"],["SOF","סופיה"],["BUH","בוקרשט"],
  ["IST","איסטנבול"],["DXB","דובאי"],["AUH","אבו דאבי"],["NYC","ניו יורק"],["BKK","בנגקוק"],["TYO","טוקיו"],
  ["__other","אחר (הזנת קוד)..."]
];

const $ = id => document.getElementById(id);
const msg = t => { $("msg").textContent = t || ""; };
let sb;

DESTINATIONS.forEach(([c,n]) => { const o=document.createElement("option"); o.value=c; o.textContent = c==="__other"?n:`${n} (${c})`; $("dest").appendChild(o); });
$("dest").onchange = () => $("customWrap").classList.toggle("hidden", $("dest").value !== "__other");

function show(loggedIn) {
  $("auth").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
}

async function load() {
  const { data: watches, error } = await sb.from("watches").select("*").order("created_at", { ascending:false });
  if (error) return msg("שגיאה בטעינה: " + error.message);
  const ids = watches.map(w => w.id);
  let latest = {};
  if (ids.length) {
    const { data: hist } = await sb.from("price_history").select("*").in("watch_id", ids).order("scanned_on", { ascending:false }).limit(1000);
    (hist||[]).forEach(h => { if (!latest[h.watch_id]) latest[h.watch_id] = h; });
  }
  const list = $("list"); list.innerHTML = "";
  if (!watches.length) list.innerHTML = '<div class="card muted">עדיין אין מעקבים. הוסף את הראשון למעלה.</div>';
  watches.forEach(w => {
    const h = latest[w.id];
    const div = document.createElement("div"); div.className = "card watch";
    const priceHtml = h
      ? `<div class="price ${h.min_price <= w.max_price ? "good":""}">$${Math.round(h.min_price)}</div>
         <div class="muted">הזול ביותר שנמצא (${h.scanned_on})<br>${h.departure_at} ← ${h.return_at}${h.transfers===0?" · ישיר":""}</div>`
      : `<div class="muted">טרם נסרק</div>`;
    div.innerHTML = `
      <div>
        <div><strong>${w.destination_name || w.destination}</strong> <span class="muted">(${w.destination})</span></div>
        <div style="margin:6px 0">
          <span class="tag">${w.month_from} עד ${w.month_to}</span>
          <span class="tag">${w.min_days}–${w.max_days} ימים</span>
          <span class="tag">עד $${Math.round(w.max_price)}</span>
          ${w.direct_only?'<span class="tag">ישיר בלבד</span>':""}
          ${w.active?"":'<span class="tag">מושהה</span>'}
        </div>
        <div class="row">
          <button class="secondary" data-act="toggle">${w.active?"השהיה":"הפעלה"}</button>
          <button class="secondary danger" data-act="del">מחיקה</button>
        </div>
      </div>
      <div style="text-align:end">${priceHtml}</div>`;
    div.querySelector('[data-act="toggle"]').onclick = async () => { await sb.from("watches").update({ active: !w.active }).eq("id", w.id); load(); };
    div.querySelector('[data-act="del"]').onclick = async () => { if (confirm("למחוק את המעקב?")) { await sb.from("watches").delete().eq("id", w.id); load(); } };
    list.appendChild(div);
  });
}

$("form").onsubmit = async e => {
  e.preventDefault(); msg("");
  let code = $("dest").value, name = $("dest").selectedOptions[0].textContent.replace(/ \(.*\)$/, "");
  if (code === "__other") { code = $("customCode").value.trim().toUpperCase(); name = code; }
  if (!/^[A-Z]{3}$/.test(code)) return msg("קוד יעד חייב להיות 3 אותיות באנגלית");
  const row = { destination: code, destination_name: name, month_from: $("mFrom").value, month_to: $("mTo").value,
    min_days: +$("minDays").value, max_days: +$("maxDays").value, max_price: +$("maxPrice").value, direct_only: $("direct").checked };
  if (row.month_from > row.month_to) return msg("חודש ההתחלה חייב להיות לפני חודש הסיום");
  if (row.min_days > row.max_days) return msg("מינימום הימים גדול מהמקסימום");
  const { error } = await sb.from("watches").insert(row);
  if (error) return msg("שגיאה בשמירה: " + error.message);
  e.target.reset(); $("minDays").value = 4; $("maxDays").value = 7; load();
};

$("loginBtn").onclick = async () => {
  msg("");
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (error) return msg("התחברות נכשלה: " + error.message);
  show(true); load();
};
$("logout").onclick = async () => { await sb.auth.signOut(); show(false); };

(async function init() {
  if (SUPABASE_URL.startsWith("PASTE")) { msg("יש למלא SUPABASE_URL ו-SUPABASE_ANON_KEY בראש הסקריפט בקובץ index.html"); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data } = await sb.auth.getSession();
  show(!!data.session);
  if (data.session) load();
})();
</script>
</body>
</html>
