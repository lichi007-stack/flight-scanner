<title>ליציטורס — טיסות זולות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#f3fafb; --card:#fff; --text:#12303f; --muted:#5f7a88; --line:#dcecf0; --accent:#0e9aa7; --accent2:#ff7a45;
    --good:#12945a; --goodbg:#e2f7ec; --warn:#b45309; --warnbg:#fff1dd; --bad:#c62828; --field:#f5fbfc;
    --sky1:#8fdcea; --sky2:#ffd9b0; --shadow:0 10px 30px rgba(14,90,110,.10); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1a22; --card:#12262f; --text:#e6f3f6; --muted:#8fb0bc; --line:#1f3b47; --accent:#37c5d1;
    --good:#4ade9b; --goodbg:#10382a; --warn:#fbbf6a; --warnbg:#3a2a12; --bad:#ff7b7b; --field:#0f202a;
    --sky1:#0f4b5b; --sky2:#6b4a5e; --shadow:0 10px 30px rgba(0,0,0,.35); } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; line-height:1.5; }
  :root { --land:#1d6a78; --far:#9bd5de; --shade:rgba(0,40,60,.22); --snow:#fff; --flame:#ffb703; --face:#fff7dc;
    --sea1:#2fd0d0; --sea2:#0e9aa7; --sun1:#fff6c8; --sun2:#ffb347; --palm:#0f8a5f; --palmdark:#7a4b2a;
    --sky0:#4fc3ea; --sky1:#8fdcf0; --sky2:#ffe3bd; }
  @media (prefers-color-scheme: dark) { :root { --land:#0a2530; --far:#173f4e; --shade:rgba(0,0,0,.35); --snow:#dfe9ff; --flame:#ffd166; --face:#cfe8ff;
    --sea1:#146b78; --sea2:#0b3a4a; --sun1:#ffffff; --sun2:#c9d6ff; --palm:#0b4a3b; --palmdark:#1d1a22;
    --sky0:#0b1d3a; --sky1:#2a2f63; --sky2:#8a5a73; } }
  .hero { position:relative; overflow:hidden; padding:34px 16px clamp(150px,24vw,270px); background:linear-gradient(180deg,var(--sky0) 0%,var(--sky1) 48%,var(--sky2) 100%); color:#06324a; }
  @media (prefers-color-scheme: dark) { .hero { color:#eaf7fa; } }
  .brand { display:flex; align-items:center; gap:16px; }
  .logo { width:clamp(90px,19vw,130px); height:auto; flex:none; filter:drop-shadow(0 6px 12px rgba(0,50,80,.3)); }
  .hero-in { position:relative; z-index:2; max-width:900px; margin:0 auto; }
  .badge { display:inline-block; padding:4px 14px; border-radius:99px; background:rgba(255,255,255,.6); font-weight:700; font-size:.85rem; letter-spacing:.04em; backdrop-filter:blur(4px); }
  @media (prefers-color-scheme: dark) { .badge { background:rgba(255,255,255,.14); } }
  h1 { font-size:clamp(1.9rem,6vw,3rem); line-height:1.15; margin:14px 0 8px; font-weight:800; text-shadow:0 2px 14px rgba(255,255,255,.35); }
  .sub { max-width:540px; margin:0; font-size:1.05rem; opacity:.9; }
  .skyline { position:absolute; left:0; bottom:-1px; width:100%; height:clamp(170px,26vw,300px); display:block; z-index:1; }
  .skyline .land { fill:var(--land); } .skyline .far { fill:var(--far); } .skyline .shade { fill:var(--shade); } .skyline .snow { fill:var(--snow); }
  .skyline .flame { fill:var(--flame); } .skyline .face { fill:var(--face); } .skyline .hands { stroke:var(--land); stroke-width:2; fill:none; }
  .skyline .lat path { stroke:var(--far); stroke-width:2; fill:none; opacity:.55; }
  .skyline .cloud ellipse { fill:#fff; opacity:.85; } .skyline .gull { fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; }
  .skyline .palmleaf { fill:var(--palm); } .skyline .palmtrunk { stroke:var(--palmdark); stroke-width:7; stroke-linecap:round; fill:var(--palmdark); }
  .skyline .palmtrunk[d] { fill:none; }
  .skyline .foam { fill:none; stroke:#fff; stroke-width:3; opacity:.75; } .skyline .foam2 { fill:none; stroke:#fff; stroke-width:2; opacity:.35; }
  @media (prefers-color-scheme: dark) { .skyline .cloud ellipse { opacity:.14; } .skyline .gull { opacity:.5; } }
  .wave { position:absolute; bottom:-1px; left:0; width:100%; height:34px; z-index:2; display:block; }
  .wave path { fill:var(--bg); }
  .wrap { position:relative; z-index:3; max-width:900px; margin:-48px auto 40px; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:18px; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 14px; font-size:1.15rem; font-weight:800; }
  label { display:block; font-size:.82rem; font-weight:500; color:var(--muted); margin-bottom:5px; }
  input, select, button { font:inherit; }
  input, select { width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--field); color:var(--text); outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(14,154,167,.15); }
  .pfx { position:relative; } .pfx span { position:absolute; inset-inline-start:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:700; } .pfx input { padding-inline-start:28px; }
  .btn { cursor:pointer; border:none; border-radius:12px; padding:12px 22px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent),#14b8a6 60%,#2dd4bf); box-shadow:0 6px 16px rgba(14,154,167,.3); transition:transform .12s, box-shadow .12s; }
  .btn:hover { transform:translateY(-1px); box-shadow:0 10px 20px rgba(14,154,167,.35); }
  .btn.full { width:100%; }
  .ghost { cursor:pointer; background:transparent; color:var(--text); border:1.5px solid var(--line); border-radius:10px; padding:6px 12px; font-size:.85rem; }
  .ghost:hover { border-color:var(--accent); color:var(--accent); } .ghost.danger:hover { border-color:var(--bad); color:var(--bad); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .between { justify-content:space-between; }
  .check { display:flex; align-items:center; gap:8px; margin:0; font-size:.95rem; color:var(--text); cursor:pointer; } .check input { width:18px; height:18px; accent-color:var(--accent); }
  .hidden { display:none !important; }
  #msg { background:var(--warnbg); color:var(--bad); border-radius:12px; padding:0 14px; max-height:0; overflow:hidden; transition:all .2s; font-weight:500; }
  #msg.on { padding:10px 14px; max-height:120px; margin-bottom:14px; }
  .auth { max-width:430px; margin:0 auto 18px; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; text-align:center; box-shadow:var(--shadow); }
  .stat b { display:block; font-size:1.5rem; font-weight:800; color:var(--accent); } .stat small { color:var(--muted); font-size:.78rem; }
  .watch { display:grid; grid-template-columns:1fr auto; gap:14px; border-inline-start:6px solid var(--accent); }
  .watch.deal { border-inline-start-color:var(--good); } .watch.paused { opacity:.6; border-inline-start-color:var(--muted); }
  @media (max-width:560px) { .watch { grid-template-columns:1fr; } .pricebox { text-align:start !important; } .stats { grid-template-columns:1fr; } .sun { width:70px; height:70px; } }
  .dest { font-size:1.3rem; font-weight:800; } .code { color:var(--muted); font-weight:500; font-size:.9rem; margin-inline-start:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 12px; }
  .chip { padding:3px 11px; border-radius:99px; background:var(--field); border:1px solid var(--line); font-size:.8rem; color:var(--muted); }
  .pricebox { text-align:end; min-width:150px; }
  .price { font-size:2rem; font-weight:800; line-height:1; } .good { color:var(--good); }
  .pill { display:inline-block; padding:3px 10px; border-radius:99px; font-size:.78rem; font-weight:700; margin-bottom:8px; }
  .pill.deal { background:var(--goodbg); color:var(--good); } .pill.wait { background:var(--warnbg); color:var(--warn); } .pill.none { background:var(--field); color:var(--muted); }
  .small { color:var(--muted); font-size:.85rem; margin-top:6px; }
  .empty { text-align:center; padding:34px 16px; } .empty .big { font-size:3rem; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:0 16px 30px; }
</style>
</head>

          <div><label>מחודש</label><input id="mFrom" type="month" required></div>
          <div><label>עד חודש</label><input id="mTo" type="month" required></div>
          <div><label>ימי חופשה: מינימום</label><input id="minDays" type="number" min="1" max="60" value="4" required></div>
          <div><label>ימי חופשה: מקסימום</label><input id="maxDays" type="number" min="1" max="60" value="7" required></div>
          <div><label>מחיר מקסימלי הלוך-חזור</label><div class="pfx"><span>$</span><input id="maxPrice" type="number" min="1" required></div></div>
        </div>
        <div class="row between" style="margin-top:16px">
          <label class="check"><input id="direct" type="checkbox"> טיסה ישירה בלבד</label>
          <button type="submit" class="btn">הוספת מעקב</button>
        </div>
      </form>
    </div>

    <div class="row between" style="margin:22px 4px 12px">
      <h2 style="margin:0;font-size:1.2rem">🧳 המעקבים שלי</h2>
      <button id="logout" class="ghost">התנתקות</button>
    </div>
    <div id="list"></div>
  </section>
</main>
<footer>המחירים ממטמון של חיפושי משתמשים ועשויים להשתנות. כדאי לאמת לפני הזמנה.</footer>

<script>
function skylineSVG() {
  var G = 330, hs = [40,58,76,92,48,66,104], ws = [26,34,42,30,50], x = 0, i = 0, far = "";
  while (x < 1900) { var w = ws[(i * 3) % 5], h = hs[(i * 5) % 7]; far += "M" + x + "," + G + "V" + (G - h) + "h" + w + "V" + G + "Z"; x += w + (i % 3) * 4; i++; }
  function wave(y, amp, st, close) { var d = "M0," + y; for (var k = 0; k < 1900; k += st * 2) d += " Q" + (k + st / 2) + "," + (y - amp) + " " + (k + st) + "," + y + " T" + (k + st * 2) + "," + y; return d + (close ? "V400H0Z" : ""); }
  function cloud(cx, cy, s) { return '<g class="cloud" transform="translate(' + cx + "," + cy + ") scale(" + s + ')"><ellipse rx="46" ry="12"/><ellipse cx="-18" cy="-10" rx="22" ry="14"/><ellipse cx="12" cy="-14" rx="26" ry="17"/></g>'; }
  function gull(gx, gy, s) { return '<path class="gull" transform="translate(' + gx + "," + gy + ") scale(" + s + ')" d="M0,0Q7,-9 14,-1Q21,-9 28,0"/>'; }
  function palm(px, py, s, flip, lean) {
    var leaf = "M0,0 Q38,-40 92,-4 Q46,-22 0,5Z", L = "", a = [-62, -30, 0, 28, 52];
    for (var k = 0; k < a.length; k++) { L += '<path class="palmleaf" d="' + leaf + '" transform="rotate(' + a[k] + ')"/><path class="palmleaf" d="' + leaf + '" transform="scale(-1,1) rotate(' + a[k] + ')"/>'; }
    return '<g transform="translate(' + px + "," + py + ") scale(" + (s * flip) + "," + s + ')"><path class="palmtrunk" d="M0,0 Q' + (lean * 0.2) + ",-80 " + lean + ',-150"/><g transform="translate(' + lean + ',-150)">' + L + '<circle class="palmtrunk" r="6" cx="-5" cy="6"/><circle class="palmtrunk" r="6" cx="6" cy="8"/></g></g>';
  }
  var liberty = '<g class="land" transform="translate(120,330)"><path d="M-44,0H44L36,-14H-36Z"/><path d="M-28,-14H28L23,-64H-23Z"/><rect x="-28" y="-72" width="56" height="8"/><path d="M-17,-72H17L13,-122L7,-136H-7L-13,-122Z"/><path d="M-13,-118L-26,-108L-30,-90L-23,-88L-17,-100L-10,-106Z"/><rect x="-33" y="-100" width="12" height="16" transform="rotate(-14 -27 -92)"/><path d="M5,-126L15,-130L25,-176L19,-178Z"/><rect x="15" y="-186" width="12" height="8" rx="2"/><path class="flame" d="M17,-186H27L24,-196L21,-212L18,-196Z"/><circle cx="0" cy="-144" r="9"/><path d="M-9,-148L-24,-157L-8,-153L-14,-171L-3,-156L0,-176L3,-156L14,-171L8,-153L24,-157L9,-148Z"/></g>';
  var eiffel = '<g class="land" transform="translate(320,330)"><path d="M0,-268L2.5,-228L6,-188L9,-162H20V-151L13,-149Q18,-102 31,-73H46V-64L31,-62Q46,-32 68,0H46Q38,-26 22,-44Q10,-52 0,-52Q-10,-52 -22,-44Q-38,-26 -46,0H-68Q-46,-32 -31,-62L-46,-64V-73H-31Q-18,-102 -13,-149L-20,-151V-162H-9L-6,-188L-2.5,-228Z"/><g class="lat"><path d="M-12,-148L12,-112M12,-148L-12,-112M-22,-100L22,-76M22,-100L-22,-76M-30,-66L36,-8M30,-66L-36,-8"/></g></g>';
  var ben = '<g class="land" transform="translate(500,330)"><path d="M-150,0V-34H-120V-52L-114,-62L-108,-52V-34H-70V-44H-40V-30H-22V0Z"/><path d="M-15,0V-112H-20V-152L-16,-152L-22,-156H22L16,-152H20V-112H15V0Z"/><path d="M-21,-152H21L17,-168H8L0,-216L-8,-168H-17Z"/><rect x="-24" y="-158" width="5" height="12"/><rect x="19" y="-158" width="5" height="12"/><circle class="face" cx="0" cy="-130" r="11"/><path class="hands" d="M0,-130V-137M0,-130L5,-128"/></g>';
  var cp = "M-118,0V-56Q-108,-78 -64,-82H44L62,-66L70,-72L82,-60L92,-66L106,-56L118,-52V0Z";
  var colo = '<g transform="translate(720,330)"><clipPath id="cc"><path d="' + cp + '"/></clipPath><path class="land" d="' + cp + '"/><g clip-path="url(#cc)"><rect x="-118" y="-78" width="236" height="22" fill="url(#ar)"/><rect x="-118" y="-52" width="236" height="22" fill="url(#ar)"/><rect x="-118" y="-26" width="236" height="22" fill="url(#ar)"/></g></g>';
  var cols = ""; for (var c = 0; c < 8; c++) cols += '<rect x="' + (-84 + c * 24) + '" y="-76" width="9" height="40"/>';
  var parth = '<g class="land" transform="translate(960,330)"><path d="M-130,0Q-110,-18 -70,-20H70Q110,-18 130,0Z"/><rect x="-96" y="-28" width="192" height="8"/><rect x="-92" y="-36" width="184" height="8"/>' + cols + '<rect x="-94" y="-86" width="188" height="10"/><path d="M-98,-86L0,-114L98,-86Z"/></g>';
  var pyr = '<g transform="translate(1180,330)"><path class="land" d="M-100,0L-4,-104L92,0Z"/><path class="shade" d="M-4,-104L92,0H-4Z"/><path class="land" d="M40,0L112,-72L184,0Z"/><path class="shade" d="M112,-72L184,0H112Z"/></g>';
  var R = [[0,-340],[2,-308],[2,-268],[6,-268],[6,-228],[10,-228],[10,-190],[15,-190],[15,-150],[21,-150],[21,-108],[27,-108],[27,-62],[34,-62],[34,0]], bd = "M", q;
  for (q = 0; q < R.length; q++) bd += R[q][0] + "," + R[q][1] + " ";
  for (q = R.length - 1; q >= 0; q--) bd += -R[q][0] + "," + R[q][1] + " ";
  var burj = '<g class="land" transform="translate(1340,330)"><path d="' + bd + 'Z"/><path d="M-72,0V-86L-62,-96V0Z M-64,0V-130L-50,-142V0Z M52,0V-104L66,-118V0Z M70,0V-72H84V0Z"/></g>';
  var fuji = '<g transform="translate(1560,330)"><path class="land" d="M-150,0L-30,-108H30L150,0Z"/><path class="snow" d="M-30,-108H30L44,-90L32,-94L20,-80L8,-94L-6,-78L-20,-92L-34,-88Z"/><g class="land" transform="translate(-100,0)"><rect x="-6" y="-8" width="12" height="8"/><path d="M-26,-8H26L18,-18H-18Z"/><path d="M-20,-18H20L14,-27H-14Z"/><path d="M-15,-27H15L10,-35H-10Z"/><path d="M-10,-35H10L6,-42H-6Z"/><path d="M-1.5,-42H1.5V-54H-1.5Z"/></g></g>';
  var opera = '<g class="land" transform="translate(1790,330)"><rect x="-70" y="-8" width="140" height="8"/><path d="M-62,-8C-62,-34 -42,-62 -10,-68C-16,-46 -16,-26 -12,-8Z"/><path d="M-26,-8C-26,-40 -4,-74 34,-80C28,-56 28,-30 32,-8Z"/><path d="M12,-8C12,-30 28,-52 56,-58C52,-40 52,-24 56,-8Z"/></g>';
  var balloon = '<g transform="translate(905,70)"><ellipse rx="26" ry="32" fill="#ff6b6b"/><path d="M-9,-31Q-24,0 -2,32H2Q24,0 9,-31Z" fill="#ffd166"/><path d="M-3,-32Q-12,0 0,32Q12,0 3,-32Z" fill="#4ecdc4"/><path d="M-12,34L-8,50M12,34L8,50" stroke="#7a4b2a" stroke-width="1.5"/><rect x="-9" y="50" width="18" height="11" rx="2" fill="#a0642f"/></g>';
  var boat = '<g transform="translate(1000,338)"><path d="M-20,0H20L14,8H-14Z" fill="#fff"/><path d="M0,-2V-40L-18,-4Z" fill="#fff"/><path d="M2,-2V-30L16,-4Z" fill="#ffd166"/></g>';
  return '<svg class="skyline" viewBox="0 0 1900 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs>' +
    '<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sea1)"/><stop offset="1" style="stop-color:var(--sea2)"/></linearGradient>' +
    '<radialGradient id="sun" cx=".4" cy=".35" r=".75"><stop offset="0" style="stop-color:var(--sun1)"/><stop offset="1" style="stop-color:var(--sun2)"/></radialGradient>' +
    '<pattern id="ar" width="15" height="22" patternUnits="userSpaceOnUse"><path d="M3,22V11Q3,4 7.5,4Q12,4 12,11V22Z" fill="rgba(255,255,255,.3)"/></pattern></defs>' +
    '<circle cx="1215" cy="150" r="170" fill="#ffd27a" opacity=".16"/><circle cx="1215" cy="150" r="120" fill="#ffd27a" opacity=".22"/><circle cx="1215" cy="150" r="74" fill="url(#sun)"/>' +
    cloud(260, 80, 1.2) + cloud(760, 56, 0.9) + cloud(1560, 92, 1.3) + cloud(1050, 120, 0.7) +
    gull(520, 60, 1) + gull(560, 84, 0.7) + gull(1420, 56, 0.9) + gull(1470, 76, 0.6) + balloon +
    '<path class="far" d="' + far + '"/>' +
    '<g transform="translate(95,33) scale(.9)">' + liberty + eiffel + ben + colo + parth + pyr + burj + fuji + opera + '</g>' +
    palm(112, 338, 1.05, 1, 26) + palm(1788, 338, 1.05, -1, 26) +
    '<path fill="url(#sea)" d="' + wave(334, 5, 50, true) + '"/><path class="foam" d="' + wave(334, 5, 50, false) + '"/>' +
    '<path class="foam2" d="' + wave(350, 6, 60, false) + '"/><path class="foam2" d="' + wave(370, 6, 70, false) + '"/>' + boat + '</svg>';
}
document.getElementById('sky').innerHTML = skylineSVG();

// ===== הגדרות חיבור ל-Supabase (המפתח ציבורי, לא service_role) =====
const SUPABASE_URL = "https://oitjbsjwfycydasdctdh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pdGpic2p3ZnljeWRhc2RjdGRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMzMzNDAsImV4cCI6MjEwNjcwOTM0MH0.-09ZaOZFNhCcbHKpxVVxkt2zEyxT8fnX44_Co8ZSwcg";

const DESTINATIONS = [
  ["ATH","אתונה"],["LCA","לרנקה"],["PFO","פאפוס"],["RHO","רודוס"],["HER","הרקליון (כרתים)"],["SKG","סלוניקי"],
  ["LON","לונדון"],["PAR","פריז"],["ROM","רומא"],["MIL","מילאנו"],["BCN","ברצלונה"],["MAD","מדריד"],
  ["LIS","ליסבון"],["AMS","אמסטרדם"],["BER","ברלין"],["VIE","וינה"],["PRG","פראג"],["BUD","בודפשט"],
  ["WAW","ורשה"],["KRK","קרקוב"],["BEG","בלגרד"],["TIA","טירנה"],["SOF","סופיה"],["BUH","בוקרשט"],
  ["IST","איסטנבול"],["DXB","דובאי"],["AUH","אבו דאבי"],["NYC","ניו יורק"],["BKK","בנגקוק"],["TYO","טוקיו"],
  ["__other","אחר (הזנת קוד)..."]
];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => { if (!d) return ""; const p = d.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; };
const fmtMonth = m => { const p = m.split("-"); return p[1] + "/" + p[0]; };
const msg = t => { const el = $("msg"); el.textContent = t || ""; el.classList.toggle("on", !!t); };
let sb;

DESTINATIONS.forEach(d => { const o = document.createElement("option"); o.value = d[0]; o.textContent = d[0] === "__other" ? d[1] : d[1] + " (" + d[0] + ")"; $("dest").appendChild(o); });
$("dest").onchange = () => $("customWrap").classList.toggle("hidden", $("dest").value !== "__other");

function show(loggedIn) {
  $("auth").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
}

async function load() {
  const res = await sb.from("watches").select("*").order("created_at", { ascending: false });
  if (res.error) return msg("שגיאה בטעינה: " + res.error.message);
  const watches = res.data;
  const ids = watches.map(w => w.id);
  let latest = {};
  if (ids.length) {
    const h = await sb.from("price_history").select("*").in("watch_id", ids).order("scanned_on", { ascending: false }).limit(1000);
    (h.data || []).forEach(r => { if (!latest[r.watch_id]) latest[r.watch_id] = r; });
  }
  const list = $("list"); list.innerHTML = "";
  let deals = 0, active = 0;
  if (!watches.length) {
    list.innerHTML = '<div class="card empty"><div class="big">🏝️</div><b>עדיין אין מעקבים</b><div class="small">הוסיפו את היעד הראשון למעלה, והסריקה הבאה תתחיל לחפש בשבילכם.</div></div>';
  }
  watches.forEach(w => {
    const h = latest[w.id];
    const isDeal = !!h && h.min_price <= w.max_price;
    if (w.active) { active++; if (isDeal) deals++; }
    let status, priceHtml;
    if (!h) {
      status = '<span class="pill none">⏳ ממתין לסריקה</span>';
      priceHtml = '<div class="small">הסריקה הבאה תעדכן כאן מחיר</div>';
    } else {
      status = isDeal ? '<span class="pill deal">🔥 מתחת לתקרה!</span>' : '<span class="pill wait">עדיין יקר</span>';
      priceHtml = '<div class="price ' + (isDeal ? "good" : "") + '">$' + Math.round(h.min_price) + '</div>' +
        '<div class="small">' + fmtDate(h.departure_at) + " ← " + fmtDate(h.return_at) + (h.transfers === 0 ? " · ישירה" : "") + '</div>' +
        '<div class="small">נסרק ב-' + fmtDate(h.scanned_on) + '</div>';
    }
    const div = document.createElement("div");
    div.className = "card watch" + (isDeal && w.active ? " deal" : "") + (w.active ? "" : " paused");
    div.innerHTML =
      '<div>' +
        '<div class="dest">' + esc(w.destination_name || w.destination) + '<span class="code">' + esc(w.destination) + '</span></div>' +
        '<div class="chips">' +
          '<span class="chip">📅 ' + fmtMonth(w.month_from) + " – " + fmtMonth(w.month_to) + '</span>' +
          '<span class="chip">🏖️ ' + w.min_days + "–" + w.max_days + ' ימים</span>' +
          '<span class="chip">💰 עד $' + Math.round(w.max_price) + '</span>' +
          (w.direct_only ? '<span class="chip">ישיר בלבד</span>' : "") +
          (w.active ? "" : '<span class="chip">⏸️ מושהה</span>') +
        '</div>' +
        '<div class="row">' +
          '<button class="ghost" data-act="edit">עריכת תקרה</button>' +
          '<button class="ghost" data-act="toggle">' + (w.active ? "השהיה" : "הפעלה") + '</button>' +
          '<button class="ghost danger" data-act="del">מחיקה</button>' +
        '</div>' +
      '</div>' +
      '<div class="pricebox">' + status + priceHtml + '</div>';
    div.querySelector('[data-act="edit"]').onclick = async () => {
      const v = prompt("תקרת מחיר חדשה הלוך-חזור ($):", Math.round(w.max_price));
      if (v === null) return;
      const n = Number(v);
      if (!(n > 0)) return msg("יש להזין מחיר חיובי");
      msg("");
      await sb.from("watches").update({ max_price: n }).eq("id", w.id); load();
    };
    div.querySelector('[data-act="toggle"]').onclick = async () => { await sb.from("watches").update({ active: !w.active }).eq("id", w.id); load(); };
    div.querySelector('[data-act="del"]').onclick = async () => { if (confirm("למחוק את המעקב?")) { await sb.from("watches").delete().eq("id", w.id); load(); } };
    list.appendChild(div);
  });
  $("stWatches").textContent = active;
  $("stDeals").textContent = deals;
}

$("form").onsubmit = async e => {
  e.preventDefault(); msg("");
  let code = $("dest").value, name = $("dest").selectedOptions[0].textContent.replace(/ \(.*\)$/, "");
  if (code === "__other") { code = $("customCode").value.trim().toUpperCase(); name = code; }
  if (!/^[A-Z]{3}$/.test(code)) return msg("קוד יעד חייב להיות 3 אותיות באנגלית");
  const row = { destination: code, destination_name: name, month_from: $("mFrom").value, month_to: $("mTo").value,
    min_days: +$("minDays").value, max_days: +$("maxDays").value, max_price: +$("maxPrice").value, direct_only: $("direct").checked };
  if (row.month_from > row.month_to) return msg("חודש ההתחלה חייב להיות לפני חודש הסיום");
  if (row.min_days > row.max_days) return msg("מינימום הימים גדול מהמקסימום");
  const r = await sb.from("watches").insert(row);
  if (r.error) return msg("שגיאה בשמירה: " + r.error.message);
  e.target.reset(); $("minDays").value = 4; $("maxDays").value = 7; $("customWrap").classList.add("hidden"); load();
};

$("loginForm").onsubmit = async e => {
  e.preventDefault(); msg("");
  const r = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (r.error) return msg("התחברות נכשלה: " + r.error.message);
  show(true); load();
};
$("logout").onclick = async () => { await sb.auth.signOut(); show(false); };

(async function init() {
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const s = await sb.auth.getSession();
  show(!!s.data.session);
  if (s.data.session) load();
})();
</script>
</body>
